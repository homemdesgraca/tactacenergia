<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperatura</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="tactacenergia_visualização.css">
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <canvas id="cena"></canvas>

  <!-- 1) TITULO -->
  <header class="absolute top-0 left-0 p-5 md:p-8 pointer-events-none">
    <h1 class="text-white text-2xl md:text-4xl font-semibold tracking-tight sombraTexto">Temperatura</h1>
  </header>

  <!-- 4) CONTADOR EM TEMPO REAL -->
  <div class="absolute top-0 right-0 p-5 md:p-8 text-right pointer-events-none">
    <div id="contador" class="text-white font-bold leading-none text-5xl md:text-7xl sombraTexto">-5.0<span class="text-2xl md:text-3xl align-top">&deg;C</span></div>
  </div>


  <div class="absolute bottom-0 inset-x-0 p-5 md:p-8">
    <div class="mx-auto flex w-full max-w-3xl items-center justify-between gap-3 rounded-2xl bg-black/35 px-5 py-4 shadow-2xl ring-1 ring-white/15 backdrop-blur-md">
      <div>
        <p class="text-white text-sm md:text-base font-medium">Sensor</p>
        <p id="estadoSensor" class="mt-1 text-[10px] md:text-xs tracking-wide text-white/55">Desconectado</p>
        <p id="estadoCaixa" class="mt-1 text-[10px] md:text-xs tracking-wide text-cyan-100" aria-live="polite">Caixa: sem leitura</p>
      </div>
      <button id="conectarSensor" type="button"
        class="rounded-full bg-white px-4 py-2 text-xs font-semibold text-slate-900 shadow-lg transition hover:bg-cyan-100 focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-2 focus:ring-offset-slate-950">
        Conectar
      </button>
    </div>
  </div>

<script src="tactacenergia_visualização.js" defer></script>
</body>
</html>
