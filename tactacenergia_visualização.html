<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensor de [ Temperatura ]</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="tactacenergia_visualização.css">
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <canvas id="cena"></canvas>

  <!-- 1) TITULO -->
  <header class="absolute top-0 left-0 p-5 md:p-8 pointer-events-none">
    <h1 class="text-white text-2xl md:text-4xl font-semibold tracking-tight sombraTexto">Sensor de [ Temperatura ]</h1>
    <p id="rotulo" class="mt-2 text-[10px] md:text-xs uppercase tracking-[0.32em] text-white/75 sombraTexto">sensor desligado · D5</p>
  </header>

  <!-- 4) CONTADOR EM TEMPO REAL -->
  <div class="absolute top-0 right-0 p-5 md:p-8 text-right pointer-events-none">
    <div id="contador" class="text-white font-bold leading-none text-5xl md:text-7xl sombraTexto">-5.0<span class="text-2xl md:text-3xl align-top">&deg;C</span></div>
    <div id="lidoSuave" class="mt-2 text-[10px] md:text-xs tracking-[0.2em] text-white/60 sombraTexto">SUAVIZADO -5.0 &deg;C</div>
  </div>

  <div class="absolute bottom-28 md:bottom-32 inset-x-0 flex justify-center pointer-events-none">
    <p id="dica" class="text-white/80 text-[10px] md:text-xs tracking-wider px-4 py-1.5 rounded-full bg-black/30 backdrop-blur-sm sombraTexto">&nbsp;</p>
  </div>

  <!-- 3) LIGACAO AO DS18B20 -->
  <div class="absolute bottom-0 inset-x-0 p-5 md:p-8">
    <div class="mx-auto w-full max-w-3xl rounded-2xl bg-black/35 backdrop-blur-md ring-1 ring-white/15 px-5 py-4 shadow-2xl">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p class="text-white text-sm md:text-base font-medium">DS18B20 waterproof · D5</p>
          <p id="estadoSensor" class="mt-1 text-[10px] md:text-xs tracking-wide text-white/55">conexao serial desligada</p>
        </div>
        <button id="conectarSensor" type="button"
          class="rounded-full bg-white px-4 py-2 text-xs font-semibold text-slate-900 shadow-lg transition hover:bg-cyan-100 focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-2 focus:ring-offset-slate-950">
          Conectar sensor
        </button>
      </div>
      <p class="mt-3 text-[9px] md:text-[10px] text-white/40">
        O microcontrolador deve enviar a temperatura em &deg;C, uma leitura por linha, a 115200 baud.
      </p>
    </div>
  </div>

<script src="tactacenergia_visualização.js" defer></script>
</body>
</html>
